<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAKELY · Product Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --ivory:#FBF7F3; --cream:#F4E8E3; --blush:#E8C9C5; --rose:#9C5F68; --rose-ink:#7E4550; --ink:#292124; --gold:#B99761; --card:#FFFFFF; --border:#E6D8D2;
  --muted:#6F6064; --faint:#9A8A8E; --hover:#F7EEEA; --focus:#9C5F68;
  --ok:#4F5E86; --ok-bg:#E7EAF3; --warn:#8A6A2F; --warn-bg:#F6EDDC; --bad:#A63D39; --bad-bg:#F7E3E1; --info:#7E4550; --info-bg:#F4E3E3; --neu:#6F6064; --neu-bg:#EFE6E2;
  --shadow:0 1px 0 rgba(41,33,36,.04), 0 8px 24px -12px rgba(41,33,36,.14);
  --serif:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-sm:6px; --r:10px; --r-lg:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ivory:#1C1618; --cream:#241C1F; --blush:#3B2B2F; --rose:#D59CA5; --rose-ink:#E6B6BD; --ink:#F4EAE6; --gold:#D4B27A; --card:#261E21; --border:#3A2E32;
  --muted:#B8A8AC; --faint:#8E7F83; --hover:#2E2427; --focus:#D59CA5;
  --ok:#A9B6DA; --ok-bg:#2B3040; --warn:#DEC08A; --warn-bg:#3A3122; --bad:#EE9C96; --bad-bg:#422523; --info:#E6B6BD; --info-bg:#3A272B; --neu:#C3B5B8; --neu-bg:#322A2D;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -14px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"]{
  --ivory:#1C1618; --cream:#241C1F; --blush:#3B2B2F; --rose:#D59CA5; --rose-ink:#E6B6BD; --ink:#F4EAE6; --gold:#D4B27A; --card:#261E21; --border:#3A2E32;
  --muted:#B8A8AC; --faint:#8E7F83; --hover:#2E2427; --focus:#D59CA5;
  --ok:#A9B6DA; --ok-bg:#2B3040; --warn:#DEC08A; --warn-bg:#3A3122; --bad:#EE9C96; --bad-bg:#422523; --info:#E6B6BD; --info-bg:#3A272B; --neu:#C3B5B8; --neu-bg:#322A2D;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -14px rgba(0,0,0,.6); color-scheme: dark; }

:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:var(--ivory); color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; font-variant-numeric: tabular-nums; }
img{ max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--rose-ink); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
h1,h2,h3{ font-family:var(--serif); font-weight:500; letter-spacing:-.01em; margin:0; line-height:1.15; }
h1{ font-size:clamp(26px, 3vw, 36px); }
h2{ font-size:22px; }
h3{ font-size:17px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.muted{ color:var(--muted); } .faint{ color:var(--faint); } .small{ font-size:13px; } .tiny{ font-size:12px; }
.num{ text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
.nowrap{ white-space:nowrap; }
.row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.row.tight{ gap:6px; } .spacer{ flex:1; }
.stack{ display:flex; flex-direction:column; gap:16px; }
.grid{ display:grid; gap:16px; }
.g2{ grid-template-columns:repeat(2, minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3, minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4, minmax(0,1fr)); }
.g-side{ grid-template-columns:minmax(0,2fr) minmax(280px,1fr); }
@media (max-width: 1100px){ .g4{ grid-template-columns:repeat(2, minmax(0,1fr)); } .g-side{ grid-template-columns:1fr; } }
@media (max-width: 760px){ .g2,.g3,.g4{ grid-template-columns:1fr; } }

/* ---------- shell ---------- */
.app{ display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
.side{ position:sticky; top:env(safe-area-inset-top,0px); height:100vh; overflow:auto; background:var(--cream); border-right:1px solid var(--border); padding:22px 14px 18px; display:flex; flex-direction:column; gap:18px; }
.brand{ padding:0 10px; }
.brand .mark{ font-family:var(--serif); font-size:28px; letter-spacing:.14em; font-weight:500; line-height:1; }
.brand .sub{ font-size:12px; color:var(--muted); margin-top:6px; }
.brand .rule{ width:28px; height:2px; background:var(--gold); margin-top:10px; }
.nav{ display:flex; flex-direction:column; gap:1px; }
.nav .grp{ font-size:12px; color:var(--faint); padding:14px 10px 4px; }
.nav a{ display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; color:var(--ink); font-size:14px; }
.nav a:hover{ background:var(--hover); text-decoration:none; }
.nav a.on{ background:var(--card); box-shadow:var(--shadow); font-weight:600; }
.nav a.on svg{ color:var(--rose); }
.nav svg{ width:17px; height:17px; flex:none; color:var(--muted); }
.side .foot{ margin-top:auto; font-size:12px; color:var(--faint); padding:0 10px; }
.main{ min-width:0; display:flex; flex-direction:column; }
.top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:12px 28px; background:color-mix(in srgb, var(--ivory) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.crumbs{ font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.crumbs a{ color:var(--muted); } .crumbs .sep{ color:var(--faint); }
.searchbtn svg{ width:16px; height:16px; flex:none; } .searchbtn .lbl{ white-space:nowrap; }
.searchbtn{ display:flex; align-items:center; gap:8px; min-width:220px; padding:7px 12px; border:1px solid var(--border); border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer; font-size:14px; }
.searchbtn kbd{ margin-left:auto; font:11px var(--sans); border:1px solid var(--border); border-radius:4px; padding:0 5px; }
.iconbtn{ position:relative; width:36px; height:36px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--border); background:var(--card); cursor:pointer; }
.iconbtn svg{ width:18px; height:18px; }
.iconbtn .dot{ position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; border-radius:9px; background:var(--rose); color:#fff; font-size:11px; display:grid; place-items:center; padding:0 4px; font-weight:600; }
.me{ display:flex; align-items:center; gap:8px; padding:3px 10px 3px 3px; border:1px solid var(--border); border-radius:999px; background:var(--card); cursor:pointer; }
.avatar{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--blush); color:var(--rose-ink); font-weight:700; font-size:12px; flex:none; }
.me .who{ font-size:13px; line-height:1.15; } .me .who span{ display:block; color:var(--muted); font-size:11px; }
.content{ padding:26px 28px 80px; max-width:1480px; width:100%; }
.phead{ display:flex; gap:16px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; margin-bottom:22px; }
.phead p{ margin:6px 0 0; color:var(--muted); max-width:70ch; }
.bottomnav{ display:none; }
@media (max-width: 900px){
  .app{ grid-template-columns:1fr; }
  .side{ position:fixed; inset:0 auto 0 0; width:270px; z-index:60; transform:translateX(-105%); transition:transform .2s ease; box-shadow:var(--shadow); padding-top:calc(22px + env(safe-area-inset-top,0px)); }
  .side.open{ transform:none; }
  .scrim{ position:fixed; inset:0; background:rgba(20,14,16,.35); z-index:55; }
  .top{ padding:10px 14px; }
  .searchbtn{ min-width:0; } .searchbtn .lbl,.searchbtn kbd,.me .who{ display:none; }
  .content{ padding:18px 14px 110px; }
  .bottomnav{ display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card); border-top:1px solid var(--border); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
  .bottomnav a,.bottomnav button{ display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--muted); background:none; border:0; padding:4px; min-height:44px; justify-content:center; }
  .bottomnav .on{ color:var(--rose); font-weight:600; }
  .bottomnav svg{ width:20px; height:20px; }
}
@media (min-width: 901px){ .menubtn{ display:none; } }

/* ---------- components ---------- */
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.card > .hd{ display:flex; align-items:center; gap:10px; padding:16px 18px 0; }
.card > .hd h2,.card > .hd h3{ flex:1; }
.card > .bd{ padding:16px 18px 18px; }
.card.flat{ box-shadow:none; }
.card.tint{ background:var(--cream); box-shadow:none; }
.kpis{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; }
@media (max-width: 1200px){ .kpis{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width: 640px){ .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi{ padding:14px 16px; border-radius:var(--r); background:var(--card); border:1px solid var(--border); display:block; color:inherit; }
a.kpi:hover{ text-decoration:none; border-color:var(--blush); }
.kpi .v{ font-family:var(--serif); font-size:28px; line-height:1.1; margin-top:4px; }
.kpi .l{ font-size:13px; color:var(--muted); }
.kpi .s{ font-size:12px; color:var(--faint); margin-top:2px; }
.kpi.alert .v{ color:var(--bad); }
.btn{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--ink); cursor:pointer; font-size:14px; font-weight:500; white-space:nowrap; min-height:36px; }
.btn:hover{ background:var(--hover); text-decoration:none; }
.btn.pri{ background:var(--rose); border-color:var(--rose); color:#fff; }
:root[data-theme="dark"] .btn.pri{ color:#231a1c; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{ color:#231a1c; } }
.btn.pri:hover{ filter:brightness(1.06); background:var(--rose); }
.btn.gold{ border-color:var(--gold); color:var(--warn); }
.btn.danger{ color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--border)); }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.sm{ padding:4px 10px; font-size:13px; min-height:30px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn svg{ width:16px; height:16px; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 9px 2px 7px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; background:var(--neu-bg); color:var(--neu); }
.pill::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.ok{ background:var(--ok-bg); color:var(--ok); } .pill.warn{ background:var(--warn-bg); color:var(--warn); } .pill.bad{ background:var(--bad-bg); color:var(--bad); } .pill.info{ background:var(--info-bg); color:var(--info); }
.pill.plain::before{ display:none; }
.tag{ display:inline-block; padding:1px 8px; border-radius:6px; background:var(--cream); border:1px solid var(--border); font-size:12px; color:var(--muted); }
.demo{ display:inline-block; padding:0 6px; border-radius:4px; font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--warn); border:1px solid color-mix(in srgb, var(--gold) 60%, transparent); vertical-align:middle; }
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto; scrollbar-width:none; }
.tabs a,.tabs button{ padding:10px 14px; font-size:14px; color:var(--muted); border:0; background:none; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; cursor:pointer; }
.tabs a:hover{ text-decoration:none; color:var(--ink); }
.tabs .on{ color:var(--ink); border-bottom-color:var(--rose); font-weight:600; }
.seg{ display:inline-flex; background:var(--cream); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
.seg button{ border:0; background:none; padding:5px 12px; border-radius:999px; font-size:13px; cursor:pointer; color:var(--muted); }
.seg button.on{ background:var(--card); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }

.tblwrap{ overflow-x:auto; border-radius:var(--r); }
table.tbl{ width:100%; border-collapse:collapse; font-size:14px; }
.tbl th{ text-align:left; font-weight:600; color:var(--muted); font-size:12.5px; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--card); position:sticky; top:0; }
.tbl th.num{ text-align:right; }
.tbl th button{ border:0; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; }
.tbl td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl tbody tr.link{ cursor:pointer; }
.tbl tbody tr.link:hover td{ background:var(--hover); }
.tbl tfoot td{ font-weight:700; border-top:1px solid var(--border); border-bottom:0; }
.tbl .code{ font-weight:600; letter-spacing:.02em; }
.tbl input,.tbl select{ min-width:70px; }
.tbl.compact td,.tbl.compact th{ padding:7px 10px; }
.diff-up{ color:var(--bad); } .diff-down{ color:var(--ok); }
tr.add td{ background:var(--ok-bg); } tr.rem td{ background:var(--bad-bg); text-decoration:line-through; } tr.chg td{ background:var(--warn-bg); }

.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:13px; font-weight:600; }
.field .hint{ font-size:12px; color:var(--faint); }
.field .err{ font-size:12.5px; color:var(--bad); }
.in{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--card); min-height:40px; }
.in:focus{ outline:2px solid color-mix(in srgb, var(--focus) 45%, transparent); border-color:var(--focus); }
.in.bad{ border-color:var(--bad); }
textarea.in{ min-height:84px; resize:vertical; }
.in.sm{ padding:5px 8px; min-height:32px; font-size:14px; }
.form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }
.form .full{ grid-column:1/-1; }
@media (max-width:640px){ .form{ grid-template-columns:1fr; } }
.filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.filters .in{ width:auto; min-height:36px; padding:6px 10px; font-size:14px; }
.filters input.in{ min-width:220px; }
.check{ display:flex; gap:8px; align-items:center; font-size:14px; }
.check input{ width:18px; height:18px; accent-color:var(--rose); }

.dl{ display:grid; grid-template-columns:minmax(120px, 38%) 1fr; gap:8px 14px; margin:0; font-size:14px; }
.dl dt{ color:var(--muted); } .dl dd{ margin:0; }
.glance{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); border:1px solid var(--border); border-radius:var(--r); background:var(--card); overflow:hidden; }
.glance > div{ padding:12px 14px; border-right:1px solid var(--border); }
.glance > div:last-child{ border-right:0; }
.glance .l{ font-size:12px; color:var(--muted); } .glance .v{ font-family:var(--serif); font-size:21px; margin-top:2px; }
@media (max-width: 1100px){ .glance{ grid-template-columns:repeat(4,1fr); } .glance > div{ border-bottom:1px solid var(--border); } }
@media (max-width: 560px){ .glance{ grid-template-columns:repeat(2,1fr); } }

.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.empty h3{ color:var(--ink); margin-bottom:6px; }
.notice{ display:flex; gap:10px; padding:12px 14px; border-radius:var(--r); background:var(--warn-bg); color:var(--warn); font-size:14px; align-items:flex-start; }
.notice.bad{ background:var(--bad-bg); color:var(--bad); } .notice.info{ background:var(--info-bg); color:var(--info); } .notice.ok{ background:var(--ok-bg); color:var(--ok); }
.notice b{ color:inherit; }
.skel{ background:linear-gradient(90deg, var(--cream), var(--hover), var(--cream)); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:8px; }
@keyframes sk{ to{ background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce){ .skel{ animation:none; } .side{ transition:none; } }

.bar{ height:8px; background:var(--cream); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
.bar > i{ display:block; height:100%; background:var(--rose); border-radius:99px; }
.bar.over > i{ background:var(--bad); }
.bar.gold > i{ background:var(--gold); }

.timeline{ list-style:none; margin:0; padding:0; }
.timeline li{ position:relative; padding:0 0 16px 22px; }
.timeline li::before{ content:''; position:absolute; left:4px; top:7px; width:8px; height:8px; border-radius:50%; background:var(--blush); border:2px solid var(--rose); }
.timeline li::after{ content:''; position:absolute; left:8px; top:18px; bottom:0; width:1px; background:var(--border); }
.timeline li:last-child::after{ display:none; }
.timeline .when{ font-size:12px; color:var(--faint); }
.timeline .what{ font-size:14px; }

.steps{ list-style:none; margin:0; padding:0; counter-reset:s; }
.steps li{ display:grid; grid-template-columns:44px 1fr; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.steps li:last-child{ border-bottom:0; }
.steps .n{ font-family:var(--serif); font-size:24px; color:var(--rose); line-height:1; }
.steps .meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.steps .warnline{ color:var(--bad); font-size:13px; margin-top:4px; }
.steps li.done .n{ color:var(--faint); }

.art{ border-radius:var(--r); background:var(--cream); display:grid; place-items:center; overflow:hidden; aspect-ratio:1; }
.art svg{ width:100%; height:100%; display:block; }
.pcard{ display:flex; flex-direction:column; gap:10px; padding:12px; color:inherit; }
.pcard:hover{ text-decoration:none; border-color:var(--blush); }
.phero{ display:grid; grid-template-columns:160px minmax(0,1fr); gap:22px; align-items:center; margin-bottom:18px; }
@media (max-width:640px){ .phero{ grid-template-columns:96px 1fr; gap:14px; } }
.phero .code{ font-size:13px; color:var(--muted); letter-spacing:.06em; }

.gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px; }
.ph{ position:relative; border-radius:var(--r); overflow:hidden; background:var(--cream); border:1px solid var(--border); cursor:zoom-in; padding:0; text-align:left; }
.ph img{ width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.ph .cap{ padding:8px 10px; font-size:12.5px; background:var(--card); }
.ph .star{ position:absolute; top:8px; left:8px; }

/* overlays */
.overlay{ position:fixed; inset:0; background:rgba(28,18,21,.45); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal{ background:var(--card); border-radius:var(--r-lg); width:min(720px, 100%); max-height:calc(100vh - 40px); display:flex; flex-direction:column; box-shadow:0 30px 80px -20px rgba(0,0,0,.4); border:1px solid var(--border); }
.modal.wide{ width:min(1040px,100%); }
.modal.narrow{ width:min(460px,100%); }
.modal .mh{ padding:18px 22px 12px; display:flex; gap:12px; align-items:flex-start; border-bottom:1px solid var(--border); }
.modal .mh h2{ flex:1; }
.modal .mb{ padding:18px 22px; overflow:auto; }
.modal .mf{ padding:14px 22px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid var(--border); flex-wrap:wrap; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--card); z-index:101; box-shadow:-20px 0 60px -20px rgba(0,0,0,.35); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); border-left:1px solid var(--border); }
.drawer .mh{ padding:18px 20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
.drawer .mh h2{ flex:1; }
.drawer .mb{ overflow:auto; padding:8px 20px 20px; flex:1; }
.notif{ display:block; padding:12px 0; border-bottom:1px solid var(--border); color:inherit; }
.notif:hover{ text-decoration:none; }
.notif.unread .t::before{ content:''; display:inline-block; width:7px; height:7px; background:var(--rose); border-radius:50%; margin-right:7px; vertical-align:middle; }

.login .pane blockquote{ font-family:var(--serif); font-size:22px; line-height:1.35; max-width:30ch; margin:0; }

.demoacc{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.chart text{ fill:var(--muted); font-size:11px; font-family:var(--sans); }
.legend{ display:flex; gap:14px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }

.costbar{ display:flex; height:14px; border-radius:99px; overflow:hidden; border:1px solid var(--border); }

.printsheet table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.printsheet td,.printsheet th{ border:1px solid #cbbcb6; padding:5px 7px; text-align:left; }
.printsheet .blank{ display:inline-block; min-width:70px; border-bottom:1px solid #999; }
.printsheet .meta{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px 18px; margin-top:12px; }
.printwrap{ position:fixed; inset:0; z-index:150; background:rgba(28,18,21,.6); overflow:auto; padding:20px; }
.printbar{ position:sticky; top:0; display:flex; gap:10px; justify-content:center; margin-bottom:14px; }
@media print{

  .printwrap{ position:static; background:none; padding:0; overflow:visible; }

}

<script>/* BAKELY BPOS — calculation engine. Pure functions, no DOM. Full precision internally; round only for display. */
(function (G) {
  const E = {};
  E.FACTOR = { g: 1, kg: 1000, ml: 1, l: 1000, pc: 1 };
  E.BASE = { g: 'g', kg: 'g', ml: 'ml', l: 'ml', pc: 'pc' };

  const day = (d) => (d ? String(d).slice(0, 10) : null);

  /* ---------- prices ---------- */
  E.sortedPrices = (item) => (item.prices || []).slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  E.priceAt = (item, date) => {
    const ps = E.sortedPrices(item);
    if (!ps.length) return null;

    let p = null;

  E.previousPrice = (item) => { const ps = E.sortedPrices(item); return ps.length > 1 ? ps[ps.length - 2] : null; };

      if (!(v.weight > 0) || !(base > 0)) throw new Error('Target batch weight must be greater than zero.');

    if (!(v.units > 0)) throw new Error('Target units must be greater than zero.');

      if (!(uw > 0)) throw new Error('Unit weight must be greater than zero.');

      if (!(base > 0)) return v.units / baseUnits;
      return (v.units * uw) / base;
    }
    return v.units / baseUnits;

  E.approvedRecipe = (recipes, productId) => recipes.find((r) => r.productId === productId && r.status === 'APPROVED') || null;

  /* ctx: {ing, pkg, products, recipes(array), settings}

    let overhead = 0;

    else if (S.overheadMethod === 'perUnit') overhead = (S.overheadPerUnit || 0) * saleUnits;

    const trueCost = baseCost + waste + overhead;
    const unitCost = saleUnits > 0 ? trueCost / saleUnits : null;
    const price = product.price || 0;
    const grossProfit = unitCost != null ? price - unitCost : null;
    const margin = unitCost != null && price > 0 ? (grossProfit / price) * 100 : null;
    const tm = (product.targetMargin != null ? product.targetMargin : S.targetMargin) / 100;

      multiplier: m, lines, ingredients, components, packaging, packagingLines, packPerSale, labour, labourLines, labourMinutes,
      utilities, baseCost, waste, overhead, trueCost, plannedPieces, pieces, unitsPerSale: ups, saleUnits, unitCost,

    if ((o.depth || 0) > 4) return 0;

  /* ---------- yield ---------- */
  E.yieldStats = (planned, saleable, rejected) => ({
    yieldPct: planned > 0 ? (saleable / planned) * 100 : null,
    wastePct: planned > 0 ? (rejected / planned) * 100 : null,
  });

  // item: {pass (bool|null), score (1-5), actual}

    if (!item) return null;

      if (item.actual == null || item.actual === '') return null;
      const a = Number(item.actual);

    }
    if (crit.type === 'score') {
      if (item.score == null || item.score === '') return null;

    let tot = 0, got = 0, missing = [], requiredFailed = [];
    for (const c of template.criteria) {
      const p = E.qcItemPass(c, items[c.id]);
      if (p === null) { if (c.required) missing.push(c.name); continue; }
      tot += c.weight; if (p) got += c.weight; else if (c.required) requiredFailed.push(c.name);
    }
    const allTot = template.criteria.reduce((s, c) => s + c.weight, 0);
    const score = allTot > 0 ? (got / allTot) * 100 : 0;
    const critical = (defects || []).some((d) => d.severity === 'CRITICAL');
    const pass = missing.length === 0 && requiredFailed.length === 0 && !critical && score >= passScore;
    return { score, pass, missing, requiredFailed, critical, evaluatedWeight: tot };
  };

  /* ---------- requirements ---------- */
  E.requirements = (ctx, plans) => {
    const need = {};
    const add = (productId, pieces, depth) => {
      if (depth > 4) return;
      const r = E.approvedRecipe(ctx.recipes, productId);

    const P = settings.production;

    return { ovenCap, bakerCap, cap, load: cap > 0 ? (plannedPieces / cap) * 100 : 0 };

    let best = [0, 0];
    for (const v of existing) {
      const [a, b] = String(v).split('.').map(Number);

  };

/* ---------------- alerts (computed) ---------------- */
function computeAlerts() {
  const out = [], today = todayStr(), cs = S.settings.costing;
  for (const i of S.ingredients) {
    const cur = E.priceAt(i), prev = E.previousPrice(i);
    if (cur && prev && dayDiff(today, cur.date.slice(0, 10)) <= 14) {
      const ch = E.priceChangePct(i);
      if (Math.abs(ch) >= (cs.priceAlertPct || 5)) { const aff = ingUsedIn(i.id); out.push({ tone: ch > 0 ? 'bad' : 'ok', text: esc(i.name) + ' price ' + (ch > 0 ? 'increased ' : 'decreased ') + pct(Math.abs(ch), 0) + ' — ' + aff.length + ' product' + (aff.length === 1 ? '' : 's') + ' affected', href: '#/costing/impact?ing=' + i.id }); }
    }
  }
  S.batches.filter((b) => b.status === 'AWAITING_QC' && (!b.qc || b.qc.status !== 'PASSED')).forEach((b) => out.push({ tone: 'warn', text: 'Batch #' + b.number + ' awaiting QC — ' + esc(P(b.productId) ? P(b.productId).name : ''), href: '#/batches/' + b.id }));
  S.batches.filter((b) => b.status === 'QC_FAILED').forEach((b) => out.push({ tone: 'bad', text: 'Batch #' + b.number + ' failed QC — corrective action needed', href: '#/batches/' + b.id }));
  S.recipes.filter((r) => r.status === 'PENDING_APPROVAL').forEach((r) => out.push({ tone: 'warn', text: esc((P(r.productId) || {}).code) + ' recipe V' + r.version + ' awaiting approval', href: '#/recipes/' + r.id }));
  lowStock().forEach((i) => out.push({ tone: 'bad', text: esc(i.name) + ' stock below reorder point (' + qtyFmt(i.stock, i.baseUnit) + ')', href: '#/ingredients/' + i.id }));
  const overdue = S.plans.filter((p) => !['COMPLETED', 'CANCELLED'].includes(p.status) && (p.date < today || (p.date === today && p.dueTime && p.dueTime < nowHM() && p.status === 'PLANNED')));
  if (overdue.length) out.push({ tone: 'bad', text: overdue.length + ' production plan' + (overdue.length > 1 ? 's are' : ' is') + ' overdue', href: '#/production/today' });
  if (costFull()) {
    const below = S.products.filter((p) => ['ACTIVE', 'SEASONAL'].includes(p.status)).filter((p) => { const c = productCost(p.id); return c && c.margin != null && c.margin < c.targetMargin; });
    if (below.length) out.push({ tone: 'warn', text: below.length + ' active product' + (below.length > 1 ? 's are' : ' is') + ' below target margin', href: '#/costing' });
  }
  for (let k = 0; k < 7; k++) { const dte = addDays(today, k); const pl = S.plans.filter((p) => p.date === dte && p.status !== 'CANCELLED'); const bakers = new Set(pl.map((p) => p.bakerId)).size || 1; const cap = E.capacity(S.settings, sum(pl, (p) => p.qty), bakers); if (cap.load > 100) { out.push({ tone: 'bad', text: 'Capacity exceeded on ' + fday(dte) + ' (' + pct(cap.load, 0) + ')', href: '#/production/capacity' }); break; } }
  return out;
}

const COSTROWS = [['ingredients', 'Ingredients', 'cb-ing'], ['packaging', 'Packaging', 'cb-pkg'], ['labour', 'Labour', 'cb-lab'], ['utilities', 'Utilities', 'cb-uti'], ['waste', 'Waste allowance', 'cb-was'], ['overhead', 'Overhead', 'cb-ovh']];
const costVal = (c, k) => (k === 'ingredients' ? c.ingredients + (c.components || 0) : c[k] || 0);
function costBar(c) { const t = c.trueCost || 1; return '<div class="costbar" role="img" aria-label="Cost composition">' + COSTROWS.map(([k, l, cls]) => '<i class="' + cls + '" style="width:' + (costVal(c, k) / t) * 100 + '%" title="' + esc(l + ' ' + pct((costVal(c, k) / t) * 100)) + '"></i>').join('') + '</div><div class="legend">' + COSTROWS.map(([k, l, cls]) => '<span><i class="' + cls + '"></i>' + l + ' ' + pct((costVal(c, k) / t) * 100, 0) + '</span>').join('') + '</div>'; }

function costBreakdownCard(product, c) {

  const top = c.lines.slice().sort((a, b) => b.cost - a.cost);
  const upm = c.unitsPerSale > 1 ? ' (' + c.unitsPerSale + ' pieces)' : '';
  return '<div class="grid g-side"><div class="stack">' +
    '<section class="card"><div class="hd"><h3>True cost · recipe V' + esc(c.recipe ? c.recipe.version : '') + '</h3><div class="row tight"><a class="btn sm" href="#/costing/whatif?p=' + product.id + '">What-if</a></div></div><div class="bd">' + costBar(c) +
    '<div class="tblwrap" style="margin-top:14px"><table class="tbl compact"><thead><tr><th>Cost element</th><th class="num">Per batch (' + fnum(c.pieces) + ' pcs)</th><th class="num">Per unit' + esc(upm) + '</th><th class="num">Share</th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><td><b>True production cost</b></td><td class="num"><b>' + money(c.trueCost) + '</b></td><td class="num"><b>' + money(c.unitCost) + '</b></td><td class="num">100%</td></tr></tfoot></table></div>' +
    '<p class="formula" style="margin-top:12px">True cost = ingredients + packaging + labour + utilities + waste (' + pct(S2.wastePct, 1) + ' of base) + overhead (' + (S2.overheadMethod === 'percent' ? pct(S2.overheadPct, 1) + ' of base' : S2.overheadMethod === 'fixed' ? money(S2.overheadFixed) + ' per batch' : money(S2.overheadPerUnit) + ' per unit') + '). Unit cost = true cost ÷ ' + fnum(c.saleUnits, 2) + ' sellable units.</p></div></section>' +
    '<section class="card"><div class="hd"><h3>Ingredient cost lines</h3></div><div class="bd">' + table([
      { key: 'name', label: 'Item', render: (l) => '<a href="' + (l.kind === 'product' ? '#/products/' : '#/ingredients/') + l.refId + '">' + esc(l.name) + '</a>' },
      { key: 'qty', label: 'Qty', num: true, render: (l) => qtyFmt(l.qty, l.unit) }, { key: 'unitCost', label: 'Cost / base', num: true, render: (l) => perBase(l.unitCost, l.unit) },
      { key: 'cost', label: 'Line cost', num: true, render: (l) => money(l.cost) }, { key: 'sh', label: 'Share', num: true, render: (l) => pct((l.cost / (c.ingredients + c.components || 1)) * 100) }], top, { compact: true }) + '</div></section>' +
    '<section class="card"><div class="hd"><h3>Packaging and labour</h3></div><div class="bd"><div class="grid g2">' +
    '<div>' + table([{ key: 'name', label: 'Packaging per unit' }, { key: 'qty', label: 'Qty', num: true }, { key: 'perSale', label: 'Per unit', num: true, render: (l) => money4(l.perSale) }], c.packagingLines, { compact: true, emptyTitle: 'No packaging' }) + '</div>' +
    '<div>' + table([{ key: 'task', label: 'Task' }, { key: 'roleId', label: 'Role', render: (l) => esc(roleName(l.roleId)) }, { key: 'minutes', label: 'Min', num: true, render: (l) => fnum(l.minutes) }, { key: 'cost', label: 'Cost', num: true, render: (l) => money(l.cost) }], c.labourLines, { compact: true, emptyTitle: 'No labour tasks' }) + '</div></div></div></section></div>' +
    '<div class="stack"><section class="card"><div class="hd"><h3>Price and margin</h3></div><div class="bd"><dl class="dl"><dt>Selling price</dt><dd><b>' + money(c.price) + '</b></dd><dt>Unit cost</dt><dd>' + money(c.unitCost) + '</dd><dt>Gross profit</dt><dd>' + money(c.grossProfit) + '</dd><dt>Gross margin</dt><dd><b class="' + (c.margin < c.targetMargin ? 'diff-up' : '') + '">' + pct(c.margin) + '</b></dd><dt>Target margin</dt><dd>' + pct(c.targetMargin, 0) + '</dd><dt>Recommended price</dt><dd><b>' + money(c.recommendedPrice) + '</b></dd><dt>Cost per piece</dt><dd>' + money4(c.pieceCost) + '</dd><dt>Labour time</dt><dd>' + fnum(c.labourMinutes) + ' min per batch</dd></dl>' +
    (c.margin < c.targetMargin ? '<div class="notice bad" style="margin-top:12px">Below target. At ' + money(c.recommendedPrice) + ' the margin would be ' + pct(c.targetMargin, 0) + '.</div>' : '<div class="notice ok" style="margin-top:12px">At or above target margin.</div>') +
    '<p class="formula" style="margin-top:12px">Margin = (price − cost) ÷ price. Recommended price = cost ÷ (1 − target margin).</p></div></section>' +
    '<section class="card"><div class="hd"><h3>Cost history</h3></div><div class="bd">' + costHistory(product) + '</div></section></div></div>';
}
function costHistory(product) {
  const bs = productBatches(product.id).filter((b) => batchCost(b)).slice(0, 20).reverse();
  if (bs.length < 2) return '<p class="muted small">Cost history appears after a few batches.</p>';

}

function batchTable(bs, o) {

}

/* generic row editor used by formula / method / controls / labour / packaging */
function rowsEditor(o) {
  const rows = clone(o.rows);
  const cell = (c, r, i) => {
    const v = r[c.key] == null ? '' : r[c.key];
    const a = ' data-i="' + i + '" data-k="' + c.key + '" aria-label="' + esc(c.label) + ' row ' + (i + 1) + '"';
    if (c.type === 'select') return '<select class="in sm"' + a + '>' + c.options.map(([val, lab]) => '<option value="' + esc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(lab) + '</option>').join('') + '</select>';
    if (c.type === 'check') return '<input type="checkbox"' + a + (v ? ' checked' : '') + '>';
    return '<input class="in sm" type="' + (c.type === 'number' ? 'number" step="any' : 'text') + '"' + a + ' value="' + esc(v) + '"' + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + '>';
  };
  const draw = (el) => {
    el.querySelector('#re-rows').innerHTML = rows.length ? '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>#</th>' + o.cols.map((c) => '<th>' + esc(c.label) + '</th>').join('') + '<th></th></tr></thead><tbody>' +
      rows.map((r, i) => '<tr><td class="faint">' + (i + 1) + '</td>' + o.cols.map((c) => '<td style="min-width:' + (c.w || 90) + 'px">' + cell(c, r, i) + '</td>').join('') + '<td class="nowrap"><button type="button" class="btn sm ghost" data-up="' + i + '" aria-label="Move row ' + (i + 1) + ' up"' + (i ? '' : ' disabled') + '>' + icon('up') + '</button><button type="button" class="btn sm ghost" data-rm="' + i + '" aria-label="Remove row ' + (i + 1) + '">' + icon('trash') + '</button></td></tr>').join('') +
      '</tbody></table></div>' : '<p class="muted small">No rows yet.</p>';
    if (o.onDraw) o.onDraw(el, rows);
  };
  const m = openModal({ title: o.title, wide: true, body: (o.intro || '') + '<div id="re-rows"></div><div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-add>' + icon('plus') + (o.addLabel || 'Add row') + '</button></div><div id="re-extra"></div>' +
      (o.reason ? '<div class="field" style="margin-top:14px"><label for="re-reason">Change note</label><input class="in" id="re-reason" placeholder="What changed and why"></div>' : '') + '<div class="err" id="re-err" hidden style="margin-top:10px"></div>',
    foot: '<button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>' + esc(o.submit || 'Save') + '</button>',
    onMount: (el) => {
      draw(el);
      const upd = (t) => { if (t.dataset.i == null || !t.dataset.k) return; const c = o.cols.find((x) => x.key === t.dataset.k); rows[+t.dataset.i][t.dataset.k] = c.type === 'check' ? t.checked : c.type === 'number' ? num(t.value) : t.value; if (o.onDraw && c.live) o.onDraw(el, rows); };
      el.addEventListener('input', (e) => upd(e.target));
      el.addEventListener('change', (e) => upd(e.target));
      el.addEventListener('click', (e) => {
        const rm = e.target.closest('[data-rm]'), up = e.target.closest('[data-up]');
        if (rm) { rows.splice(+rm.dataset.rm, 1); draw(el); }
        if (up) { const i = +up.dataset.up; if (i > 0) { const t = rows[i]; rows[i] = rows[i - 1]; rows[i - 1] = t; draw(el); } }
        if (e.target.closest('[data-add]')) { rows.push(o.blank()); draw(el); const ins = el.querySelectorAll('#re-rows tbody tr:last-child .in'); if (ins[0]) ins[0].focus(); }
      });
    } });
  m.el.querySelector('[data-x]').onclick = () => closeModal(m);
  m.el.querySelector('[data-ok]').onclick = () => {
    const msg = o.validate ? o.validate(rows) : '';
    const er = m.el.querySelector('#re-err');
    if (msg) { er.hidden = false; er.textContent = msg; return; }
    const reason = o.reason ? m.el.querySelector('#re-reason').value.trim() : '';
    closeModal(m, true); o.onSave(rows, reason);
  };
  return m;
}

/* scaling */
function scaleTab(r) {
  const f = UI.f; const mode = f.scMode || 'units';
  const inputs = mode === 'units' ? '<div class="field"><label for="sc1">Target pieces</label><input class="in" id="sc1" type="number" min="1" step="1" value="' + esc(f.scUnits || r.yieldUnits * 2) + '" data-oninput="scale" data-f="scUnits"></div>' + (r.unitWeight ? '<div class="field"><label for="sc2">Unit weight (g)</label><input class="in" id="sc2" type="number" min="1" step="any" value="' + esc(f.scUW || r.unitWeight) + '" data-oninput="scale" data-f="scUW"><div class="hint">Change to resize pieces.</div></div>' : '')
    : mode === 'weight' ? '<div class="field"><label for="sc1">Target batch weight (g)</label><input class="in" id="sc1" type="number" min="1" step="any" value="' + esc(f.scW || Math.round(E.totalDoughWeight(r, C().ing) * 2)) + '" data-oninput="scale" data-f="scW"></div>'
      : '<div class="field"><label for="sc1">Number of batches</label><input class="in" id="sc1" type="number" min="0.1" step="any" value="' + esc(f.scB || 2) + '" data-oninput="scale" data-f="scB"></div>';
  return '<section class="card"><div class="hd"><h3>Scale this recipe</h3>' + seg('scMode', [['units', 'By pieces'], ['weight', 'By batch weight'], ['batches', 'By batches']], mode) + '</div><div class="bd"><div class="form" style="max-width:520px" data-rid="' + r.id + '">' + inputs + '</div><div id="scaleOut" style="margin-top:14px">' + scaleOut(r) + '</div></div></section>';
}
function scaleOut(r) {
  const f = UI.f; const mode = f.scMode || 'units'; let k;
  try { k = E.scaleFactor(r, C().ing, mode, mode === 'units' ? { units: Number(f.scUnits || r.yieldUnits * 2), unitWeight: Number(f.scUW || r.unitWeight) || null } : mode === 'weight' ? { weight: Number(f.scW || E.totalDoughWeight(r, C().ing) * 2) } : { batches: Number(f.scB || 2) }); }
  catch (e) { return '<div class="notice bad">' + esc(e.message) + '</div>'; }
  const lines = E.scaleLines(r, k);
  const pieces = mode === 'units' ? Number(f.scUnits || r.yieldUnits * 2) : r.yieldUnits * k;
  let cost = null; if (costFull()) try { cost = E.cost(C(), r, { multiplier: k }); } catch (e) {}
  return '<div class="row small" style="gap:18px;margin-bottom:10px"><span>Scale factor <b>' + fnum(k, 3) + '×</b></span><span>Pieces <b>' + fnum(pieces) + '</b></span><span>Batch weight <b>' + qtyFmt(E.totalDoughWeight(r, C().ing) * k, 'g') + '</b></span>' + (cost ? '<span>Batch cost <b>' + money(cost.trueCost) + '</b></span>' : '') + '</div>' +
    table([{ key: 'n', label: 'Ingredient', render: (l) => esc(refName(l)) }, { key: 'o', label: 'Base', num: true, render: (l, i) => qtyFmt(l.qty / k, refUnit(l)) }, { key: 'qty', label: 'Scaled', num: true, render: (l) => '<b>' + qtyFmt(l.qty, refUnit(l)) + '</b>' }], lines, { compact: true }) +
    '<p class="tiny faint" style="margin:8px 0 0">Scaled quantity = base quantity × ' + fnum(k, 4) + '. Methods and bake times are not scaled automatically; oven loading may change.</p>';
}

  S.recipes.forEach((r) => idx.push({ k: 'Recipe', t: ((P(r.productId) || {}).code || '') + ' V' + r.version, s: ((P(r.productId) || {}).name || '') + ' · ' + titleCase(r.status), h: '#/recipes/' + r.id }));
  S.ingredients.forEach((i) => idx.push({ k: 'Ingredient', t: i.name, s: (i.sku || '') + ' · ' + i.category, h: '#/ingredients/' + i.id }));
  S.suppliers.forEach((x) => idx.push({ k: 'Supplier', t: x.company, s: x.contact || '', h: '#/suppliers/' + x.id }));
  S.packaging.forEach((x) => idx.push({ k: 'Packaging', t: x.name, s: x.sku || '', h: '#/packaging/' + x.id }));
  S.batches.forEach((b) => idx.push({ k: 'Batch', t: '#' + b.number + ' ' + ((P(b.productId) || {}).code || ''), s: fdate(b.date) + ' · ' + titleCase(b.status) + ' · ' + b.ingredients.map((x) => x.lot).filter(Boolean).join(' '), h: '#/batches/' + b.id }));

  let sel = 0, cur0 = [];
  const draw = () => { const q = m.el.querySelector('#sq').value.trim().toLowerCase(); const toks = q.split(/\s+/).filter(Boolean); cur0 = toks.length ? idx.concat(pages).filter((x) => { const hay = (x.k + ' ' + x.t + ' ' + x.s).toLowerCase(); return toks.every((t) => hay.includes(t)); }).slice(0, 30) : pages.slice(0, 16); sel = Math.min(sel, Math.max(0, cur0.length - 1)); m.el.querySelector('#sres').innerHTML = cur0.length ? cur0.map((x, i) => '<a href="' + x.h + '" role="option" class="' + (i === sel ? 'sel' : '') + '" aria-selected="' + (i === sel) + '"><span class="k">' + esc(x.k) + '</span><span><b>' + esc(x.t) + '</b><div class="tiny faint">' + esc(x.s) + '</div></span></a>').join('') : '<p class="muted small" style="padding:12px">No matches.</p>'; };

    foot: '<button class="btn" data-x>Cancel</button><button class="btn danger" data-ok disabled>Delete everything listed</button>' });
  const inp = m.el.querySelector('#ccc'), ok = m.el.querySelector('[data-ok]');
  inp.oninput = () => { ok.disabled = inp.value.trim().toUpperCase() !== 'DELETE'; };
  m.el.querySelector('[data-bk]').onclick = () => ACT['export-json']();
  m.el.querySelector('[data-x]').onclick = () => closeModal(m, true);
  ok.onclick = () => {
    S.batches.slice().forEach((x) => drop('batches', x.id));
    S.plans.slice().forEach((x) => drop('plans', x.id));
    S.photos.filter((x) => pids.has(x.productId)).forEach((x) => drop('photos', x.id));
    S.documents.filter((x) => ['product', 'recipe', 'batch'].includes(x.entityType)).forEach((x) => drop('documents', x.id));
    S.recipes.slice().forEach((x) => drop('recipes', x.id));
    S.products.slice().forEach((x) => drop('products', x.id));
    S.dev.filter((x) => x.productId).forEach((x) => { x.productId = null; put('dev', x); });
    audit('Settings', 'catalogue', 'DELETE', 'Deleted all products and recipes (' + counts.products + ' products, ' + counts.recipes + ' recipe versions, ' + counts.batches + ' batches, ' + counts.plans + ' plans)', { counts });
    if (S.mode === 'local') saveLocalSoon();
    closeModal(m, true); toast('All products and recipes deleted'); go('#/products');
  };
};

      if (!icats.includes(category)) icats.push(category);
      const row = { id, name, sku: 'LIB-' + String(LIB_INGREDIENTS.indexOf(r) + 1).padStart(3, '0'), category, baseUnit, supplierId: LIB_SUP.id, preferredSupplierId: LIB_SUP.id, storage, shelfLifeDays: shelf, allergens: allergens.slice(), minStock: null, reorderPoint: null, stock: 0,
        prices: [{ id: 'PR-' + Math.random().toString(36).slice(2, 10), date: now, supplierId: LIB_SUP.id, packSize, packUnit, price, by, note: 'Indicative library price — replace with your supplier quote' }], active: true, library: true, createdAt: now };
      if (ex && ex.f) row.isFlour = true; if (ex && ex.gpu) row.gramsPerUnit = ex.gpu;
      put('ingredients', row); addedI++;
    });
    if (withPk) newP.forEach((r) => {
      const [name, type, packSize, price] = r;
      let id; do { id = 'PK-' + Math.random().toString(36).slice(2, 7).toUpperCase(); } while (!idOk('packaging', id));
      put('packaging', { id, sku: 'LIBP-' + String(LIB_PACKAGING.indexOf(r) + 1).padStart(3, '0'), name, type, supplierId: LIB_SUP.id, unit: 'pc', prices: [{ id: 'PP-' + Math.random().toString(36).slice(2, 10), date: now, supplierId: LIB_SUP.id, packSize, packUnit: 'pc', price, by, note: 'Indicative library price' }], moq: packSize, storage: 'Dry store, flat', stock: 0, active: true, library: true, createdAt: now });
      addedP++;
    });
    saveSettings();
    audit('Ingredient', 'library', 'CREATE', 'Added standard bakery library: ' + addedI + ' ingredients, ' + addedP + ' packaging items', { addedI, addedP });
    if (S.mode === 'local') saveLocalSoon();
    closeModal(m, true); toast('Added ' + addedI + ' ingredients and ' + addedP + ' packaging items'); render();
  };
};
</script>
